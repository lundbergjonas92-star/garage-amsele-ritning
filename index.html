<script>
const MATT = "# Alla m\u00e5tt f\u00f6r garaget i \u00c5msele. Anv\u00e4nds av ritning.py (2D) och modell3d.py (3D).\n# \u00c4ndra h\u00e4r och k\u00f6r om:  python ritning.py   och   blender --background --python modell3d.py\nimport math\n\n# ---- M\u00e5tt i meter ----\nVAGG = 2.8                 # v\u00e4ggh\u00f6jd, b\u00e5da byggnaderna\nLUTNING = 34               # befintligt tak i grader; tillbyggnadens lutning r\u00e4knas fram s\u00e5 att nockarna blir lika h\u00f6ga\nE_B, E_L = 5.0, 10.0       # befintlig byggnad: bredd, l\u00e4ngd\nN_L, N_B = 12.0, 6.0       # tillbyggnad: l\u00e4ngd, bredd\nE_X = 4.5                  # tillbyggnaden sticker ut s\u00e5 h\u00e4r l\u00e5ngt till v\u00e4nster om befintlig\nPORT_B, PORT_H = 3.0, 2.4  # garageport i gaveln mot grusplanen\n# befintliga \u00f6ppningar (y0, y1) i meter fr\u00e5n bortre gaveln; placering uppskattad fr\u00e5n skiss och video\nGRUS_DORR, GRUS_FONSTER = [(5.6, 7.8)], [(1.1, 2.2)]      # fasad 1, mot grusplanen\nALTAN_DORR, ALTAN_FONSTER = [(7.5, 8.4)], [(2.0, 3.0)]    # fasad 3, mot altanen\nDORR_H, FONSTER_H = 2.1, (0.9, 2.1)                       # d\u00f6rrh\u00f6jd; f\u00f6nster underkant, \u00f6verkant\nN_FONSTER_NORR = [(2.45, 3.55), (8.45, 9.55)]  # f\u00f6rslag, fasad 2: meter fr\u00e5n tillbyggnadens v\u00e4nstra gavel\nN_FONSTER_VAST = [(12.45, 13.55)]             # f\u00f6rslag, fasad 3 (gaveln): meter fr\u00e5n bortre gaveln\nTF, GAV = 0.5, 0.3         # befintligt takutspr\u00e5ng vid takfot (l\u00e5ngsidor) och vid gavel, uppskattat fr\u00e5n video\nSNO_IN, SNO_H, SNO_CC = 0.4, 0.15, 1.2  # sn\u00f6rasskydd (galler): avst\u00e5nd in fr\u00e5n takfoten, h\u00f6jd, f\u00e4sten c/c. Uppskattat\nRANNA = 0.15               # h\u00e4ngr\u00e4nnans storlek\nT = 0.2                    # v\u00e4ggtjocklek i planen\n\n# ---- h\u00e4rlett fr\u00e5n m\u00e5tten ovan (\u00e4ndra inte h\u00e4r) ----\ntan = math.tan(math.radians(LUTNING))\nE_NOCK = VAGG + E_B / 2 * tan\nN_NOCK = E_NOCK\nN_LUTNING = math.degrees(math.atan((N_NOCK - VAGG) / (N_B / 2)))\nE_HX = E_X + E_B           # befintligs h\u00f6gra v\u00e4gg\nY_N = E_L                  # skarven mellan befintlig och tillbyggnad\nPORT_MITT = Y_N + N_B / 2\nN_TAN = (N_NOCK - VAGG) / (N_B / 2)\nE_TF = VAGG - TF * tan     # takfotens h\u00f6jd, befintlig\nTF_N = (VAGG - E_TF) / N_TAN  # tillbyggnadens takutspr\u00e5ng: s\u00e5 l\u00e5ngt att takfoten hamnar p\u00e5 samma h\u00f6jd (r\u00e4nnorna i en linje)\nN_TF = VAGG - TF_N * N_TAN    # = E_TF\nMX = E_X + E_B / 2         # befintligs nock (x)\n# stupr\u00f6r: (v\u00e4gg, meter l\u00e4ngs v\u00e4ggen). Tillbyggnadens korta takf\u00f6tter mot befintlig rinner till r\u00e4nnorna i innerh\u00f6rnen.\nSTUPROR = [(\"E_ost\", 0.2), (\"E_ost\", Y_N - TF_N - 0.2), (\"E_vast\", 0.2), (\"E_vast\", Y_N - TF_N - 0.2),\n           (\"N_norr\", 0.2), (\"N_norr\", N_L - 0.2)]\nassert E_HX <= N_L and PORT_B < N_B - 2 * T and PORT_H < VAGG\n# sn\u00f6rasskydd l\u00e4ngs alla takf\u00f6tter: (axel den l\u00f6per l\u00e4ngs, l\u00e4ge p\u00e5 andra axeln, start, slut, h\u00f6jd vid foten)\n# De slutar 0,1 m f\u00f6re r\u00e4nndalen. R\u00e4nndalen g\u00e5r i planen fr\u00e5n innerh\u00f6rnet (E_X - TF, Y_N - TF_N) till (MX, PORT_MITT).\n_dal = (MX - (E_X - TF)) / (PORT_MITT - (Y_N - TF_N))   # r\u00e4nndalens lutning i planen, dx/dy\n_ze, _zn = E_TF + SNO_IN * tan, N_TF + SNO_IN * N_TAN\n_ye = Y_N - TF_N + SNO_IN / _dal - 0.1                  # befintligs galler slutar h\u00e4r (y)\n_xn = E_X - TF + SNO_IN * _dal - 0.1                    # tillbyggnadens fr\u00e4mre galler slutar h\u00e4r (x, v\u00e4nster sida)\nSNORAS = [(\"y\", E_X - TF + SNO_IN, -GAV + 0.1, _ye, _ze), (\"y\", E_HX + TF - SNO_IN, -GAV + 0.1, _ye, _ze),\n          (\"x\", Y_N - TF_N + SNO_IN, -GAV + 0.1, _xn, _zn), (\"x\", Y_N - TF_N + SNO_IN, 2 * MX - _xn, N_L + GAV - 0.1, _zn),\n          (\"x\", Y_N + N_B + TF_N - SNO_IN, -GAV + 0.1, N_L + GAV - 0.1, _zn)]\nassert abs(N_TF - E_TF) < 1e-9\n", RITNING = "# Bygglovsritning, tillbyggnad garage \u00c5msele (A3, skala 1:100).\n# M\u00e5tten st\u00e5r i matt.py. K\u00f6r:  python ritning.py   -> Bygglovsritning_garage_Amsele.pdf\nimport datetime, math, pathlib\n\nfrom matt import *\n\nFASTIGHET = \"[fastighetsbeteckning]\"\nRITAD_AV = \"[namn]\"\nDATUM = datetime.date.today().isoformat()\n\n\ndef f(v, d=1):\n    return f\"{v:.{d}f}\".replace(\".\", \",\")\n\n\ndef vy(ox, oy, k=10):  # meter -> mm p\u00e5 papperet; k = mm per meter (10 = 1:100, 20 = 1:50)\n    return lambda u, h: (ox + k * u, oy - k * h)\n\n\ndef poly(pts, cls):\n    return f'<polygon class=\"{cls}\" points=\"{\" \".join(f\"{x:.2f},{y:.2f}\" for x, y in pts)}\"/>'\n\n\ndef pline(pts, cls):\n    return f'<polyline class=\"{cls}\" points=\"{\" \".join(f\"{x:.2f},{y:.2f}\" for x, y in pts)}\"/>'\n\n\ndef line(a, b, cls=\"t\"):\n    return f'<line class=\"{cls}\" x1=\"{a[0]:.2f}\" y1=\"{a[1]:.2f}\" x2=\"{b[0]:.2f}\" y2=\"{b[1]:.2f}\"/>'\n\n\ndef text(x, y, s, size=3, anchor=\"middle\", rot=0, bold=False, cls=\"h\"):\n    tr = f' transform=\"rotate({rot} {x:.2f} {y:.2f})\"' if rot else \"\"\n    w = ' font-weight=\"500\"' if bold else \"\"\n    return f'<text class=\"{cls}\" x=\"{x:.2f}\" y=\"{y:.2f}\" font-size=\"{size}\" text-anchor=\"{anchor}\"{w}{tr}>{s}<\/text>'\n\n\ndef rubrik(x, y, s, size=3.5, anchor=\"middle\"):  # vyrubrik: understruken, inte fet\n    return text(x, y, s, size, anchor, cls=\"h u\")\n\n\ndef box(p, u0, h0, u1, h1, cls):\n    return poly([p(u0, h0), p(u1, h0), p(u1, h1), p(u0, h1)], cls)\n\n\ndef dim(p, a, b, off, vertical=False):\n    (x0, y0), (x1, y1) = (p(off, a), p(off, b)) if vertical else (p(a, off), p(b, off))\n    s = line((x0, y0), (x1, y1))\n    for x, y in ((x0, y0), (x1, y1)):\n        s += line((x - 1, y + 1), (x + 1, y - 1))\n    if vertical:\n        return s + text(x0 - 1.2, (y0 + y1) / 2, f(abs(b - a)), 2.8, rot=-90)\n    return s + text((x0 + x1) / 2, y0 - 1.2, f(abs(b - a)), 2.8)\n\n\ndef niva(p, u, h, left=False):\n    x, y = p(u, h)\n    k = -1 if left else 1\n    return line((x, y), (x + 5 * k, y)) + text(x + 6 * k, y + 1, \"+\" + f(h, 2), 2.8, \"end\" if left else \"start\")\n\n\ndef pil(p, u, h, ang):  # pil mot byggnaden, ang i grader p\u00e5 papperet (0 = h\u00f6ger, 90 = ned\u00e5t)\n    x, y = p(u, h)\n    c, s = math.cos(math.radians(ang)), math.sin(math.radians(ang))\n    bas = [(x - 2 * c + a * s, y - 2 * s - a * c) for a in (-2, 2)]\n    return poly([(x + 2 * c, y + 2 * s), *bas], \"pil\")\n\n\ndef bubbla(p, n, pos, mal=None):  # numrerad h\u00e4nvisning till F\u00d6RKLARINGAR; mal = punkten pinnen pekar p\u00e5\n    x, y = p(*pos)\n    s = line((x, y), p(*mal)) if mal else \"\"\n    return s + f'<circle class=\"bub\" cx=\"{x:.2f}\" cy=\"{y:.2f}\" r=\"2.2\"/>' + text(x, y + 1, str(n), 2.8, cls=\"\")\n\n\ndef vinkel(p, u, h, grad, ut):  # takvinkel: b\u00e5ge mellan v\u00e5gr\u00e4t linje och takytan; ut = +1/-1 \u00e5t vilket h\u00e5ll taket faller\n    x, y = p(u, h)\n    r, a = 9, math.radians(grad)\n    b = a / 2\n    return (line((x, y), (x + ut * (r + 2), y)) +\n            f'<path class=\"t\" d=\"M{x + ut * r:.2f},{y:.2f} A{r},{r} 0 0 {1 if ut > 0 else 0} '\n            f'{x + ut * r * math.cos(a):.2f},{y + r * math.sin(a):.2f}\"/>' +\n            text(x + ut * (r + 1.5) * math.cos(b), y + (r + 1.5) * math.sin(b) + 1, f\"{f(grad)}\u00b0\", 2.5, \"start\" if ut > 0 else \"end\"))\n\n\ndef fall(p, u, h, ang, grad):  # takfallspil med lutning; ang p\u00e5 papperet (0 = h\u00f6ger, 90 = ned\u00e5t)\n    x, y = p(u, h)\n    c, s = math.cos(math.radians(ang)), math.sin(math.radians(ang))\n    x1, y1 = x + 14 * c, y + 14 * s\n    spets = [(x1 - 3 * c + 1.5 * s * k, y1 - 3 * s - 1.5 * c * k) for k in (-1, 1)]\n    return (line((x, y), (x1, y1), \"l\") + pline([spets[0], (x1, y1), spets[1]], \"l\") +\n            text(x + 7 * c + 4 * abs(s), y + 7 * s - 4 * abs(c) + 1, f\"{f(grad)}\u00b0\", 3))  # texten ovanf\u00f6r eller till h\u00f6ger\n\ndef mm(v):  # meter -> \"2 100\" (mm med mellanslag, som referensritningen)\n    return f\"{round(v * 1000):,}\".replace(\",\", \" \")\n\n\ndef kedja(p, punkter, off, vertical=False, sz=2.2):  # m\u00e5ttkedja i mm med snedstreck vid varje m\u00e5tt\n    pts = sorted(punkter)\n    q = (lambda t: p(off, t)) if vertical else (lambda t: p(t, off))\n    s = line(q(pts[0] - 0.15), q(pts[-1] + 0.15))\n    for t in pts:\n        x, y = q(t)\n        s += line((x - 1, y + 1), (x + 1, y - 1))\n    for a, b in zip(pts, pts[1:]):\n        x, y = q((a + b) / 2)\n        s += text(x - 1, y, mm(b - a), sz, rot=-90) if vertical else text(x, y - 1, mm(b - a), sz)\n    return s\n\n\ndef bitar(axel, c0, c1, a0, a1, gaps, k):  # v\u00e4gg med \u00f6ppningar -> l\u00e5dor (x0, y0, x1, y1, k). axel = l\u00e4ngs x eller y\n    out, a = [], a0\n    for g0, g1 in sorted(gaps) + [(a1, a1)]:\n        if g0 > a:\n            out.append((c0, a, c1, g0, k) if axel == \"y\" else (a, c0, g0, c1, k))\n        a = max(a, g1)\n    return out\n\n\ndef vaggar(p, lador):  # kontur f\u00f6rst, fyllning ovanp\u00e5: inga streck d\u00e4r v\u00e4ggbitar m\u00f6ts, bara runt om och vid \u00f6ppningar\n    return \"\".join(box(p, *b[:4], \"vk\") for b in lador) + \"\".join(box(p, *b[:4], b[4] + \"f\") for b in lador)\n\n\ndef vq(p, v):  # v\u00e4ggens egna koordinater: u l\u00e4ngs v\u00e4ggen, d in\u00e5t fr\u00e5n ytterytan. v = (axel, ytterytans l\u00e4ge, n ut\u00e5t)\n    axel, yta, n = v\n    return (lambda u, d: p(yta - n * d, u)) if axel == \"x\" else (lambda u, d: p(u, yta - n * d))\n\n\ndef plan_fonster(p, v, u0, u1):  # karm vid ytterytan, glaslinje, f\u00f6nsterb\u00e4nk vid innerytan, mittpost\n    q, m = vq(p, v), (u0 + u1) / 2\n    return \"\".join(line(q(u0, d), q(u1, d)) for d in (0.03, 0.1, T)) + line(q(m, 0.03), q(m, 0.1))\n\n\ndef plan_dorr(p, v, u0, u1, gangjarn):  # d\u00f6rrblad + slagb\u00e5ge, \u00f6ppnar ut\u00e5t. gangjarn = lista med (u, riktning mot andra karmen)\n    q, s = vq(p, v), \"\"\n    w = (u1 - u0) / len(gangjarn)\n    for u, r in gangjarn:\n        s += line(q(u, 0), q(u, -w), \"l\")\n        s += pline([q(u + r * w * math.sin(a), -w * math.cos(a)) for a in (math.pi / 2 * i / 16 for i in range(17))], \"t\")\n    return s\n\n\ndef karm(p, u0, h0, u1, h1, k=0.07, botten=True):  # \u00f6ppning med karm: yttre kontur + inre linje\n    u0, u1 = min(u0, u1), max(u0, u1)\n    return box(p, u0, h0, u1, h1, \"port\") + box(p, u0 + k, h0 + k * botten, u1 - k, h1 - k, \"t\")\n\n\ndef oppningar(p, dorrar, fonster, u=lambda y: y):  # d\u00f6rrar och f\u00f6nster i en fasad\n    s = [karm(p, u(a), 0, u(b), DORR_H, botten=False) for a, b in dorrar]\n    for a, b in fonster:\n        m = (u(a) + u(b)) / 2\n        s += [karm(p, u(a), FONSTER_H[0], u(b), FONSTER_H[1]), line(p(m, FONSTER_H[0] + 0.07), p(m, FONSTER_H[1] - 0.07))]\n    return \"\".join(s)\n\n\n_klipp = iter(range(1000))\n\n\ndef ribbor(p, pts, langs_x, rillor=True):  # takpl\u00e5t Ranarp som linjer: ribba c/c 275 mm + designrillor c/c 92 mm (SVG-m\u00f6nster gav rutn\u00e4t i Edge)\n    cid = f\"klipp{next(_klipp)}\"\n    yta = [p(*q) for q in pts]\n    s = f'<clipPath id=\"{cid}\">{poly(yta, \"\")}<\/clipPath><g clip-path=\"url(#{cid})\">{poly(yta, \"takbg\")}'\n    xs, ys = [q[0] for q in pts], [q[1] for q in pts]\n    a0, a1, b0, b1 = (min(ys), max(ys), min(xs), max(xs)) if langs_x else (min(xs), max(xs), min(ys), max(ys))\n    i = 0\n    while a0 + i * 0.275 <= a1:\n        for d, cls in ((0, \"ribba\"), (0.092, \"rilla\"), (0.183, \"rilla\"))[:3 if rillor else 1]:\n            v = a0 + i * 0.275 + d\n            q0, q1 = ((b0, v), (b1, v)) if langs_x else ((v, b0), (v, b1))\n            s += line(p(*q0), p(*q1), cls)\n        i += 1\n    return s + \"<\/g>\"\n\n\ndef ruta(x, y, w, h, etikett=\"\", varde=\"\", size=3, mitt=False):  # en ruta i ritningshuvudet: liten etikett + v\u00e4rde\n    s = f'<rect class=\"l\" x=\"{x}\" y=\"{y}\" width=\"{w}\" height=\"{h}\"/>'\n    if etikett:\n        s += text(x + 1, y + 2.2, etikett, 1.6, \"start\", cls=\"\")\n    if varde:\n        s += text(x + w / 2 if mitt else x + 1.5, y + h - 2, varde, size, \"middle\" if mitt else \"start\", cls=\"\")\n    return s\n\n\ndef huvud(innehall, nr, skala=\"1:100 (A3)\", x=290, y=225, sc=1, matt=\"M\u00e5tt i meter.\"):  # ritningshuvud i rutor, 120 x 62 mm f\u00f6re skalning\n    s = [ruta(0, 0, 10, 4.5), ruta(10, 0, 70, 4.5), ruta(80, 0, 15, 4.5), ruta(95, 0, 25, 4.5),\n         ruta(0, 4.5, 10, 4.5, \"BET\"), ruta(10, 4.5, 70, 4.5, \"\u00c4NDRINGEN AVSER\"), ruta(80, 4.5, 15, 4.5, \"SIGN\"),\n         ruta(95, 4.5, 25, 4.5, \"DATUM\"),\n         ruta(0, 9, 120, 10, \"\", \"BYGGLOVSHANDLING\", 5, True),\n         ruta(0, 19, 120, 13, \"PROJEKT\"), text(1.5, 25.5, \"TILLBYGGNAD GARAGE\", 4, \"start\", cls=\"\"),\n         text(1.5, 30, f\"Fastighet {FASTIGHET}, \u00c5msele\", 2.8, \"start\", cls=\"\"),\n         ruta(0, 32, 120, 10, \"ANM\u00c4RKNING\"),\n         text(1.5, 37.3, f\"{matt} V\u00e4gg {f(VAGG)} m. Taklutning {LUTNING}\u00b0 bef. / {f(N_LUTNING)}\u00b0 tillb.\", 2.3, \"start\", cls=\"\"),\n         text(1.5, 40.5, \"Material och kul\u00f6rer: se ritning A-02.\", 2.3, \"start\", cls=\"\"),\n         ruta(0, 42, 80, 9, \"INNEH\u00c5LL\", innehall, 3.2), ruta(80, 42, 40, 9, \"SKALA\", skala, 3.2),\n         ruta(0, 51, 25, 11, \"DATUM\", DATUM, 2.8), ruta(25, 51, 25, 11, \"RITAD AV\", RITAD_AV, 2.8),\n         ruta(50, 51, 20, 11, \"STATUS\", \"UTKAST\", 2.8), ruta(70, 51, 40, 11, \"NUMMER\", nr, 7, True),\n         ruta(110, 51, 10, 11, \"BET\", \"-\", 4, True)]\n    return f'<g transform=\"translate({x} {y}) scale({sc})\">{\"\".join(s)}<\/g>'\n\n\ndef skalstock(x, y, k=10, skala=\"1:100\", n=5):  # liggande skalstock som referensritningen; y = linjen\n    s = line((x, y), (x + n * k, y))\n    s += \"\".join(line((x + k * i / 10, y - 0.8), (x + k * i / 10, y + 0.8)) for i in range(11))  # f\u00f6rsta metern i dm\n    s += \"\".join(line((x + k * i / 2, y - 1.4), (x + k * i / 2, y + 1.4)) for i in range(2, 2 * n + 1))  # sedan var halvmeter\n    s += \"\".join(text(x + k * i, y + 4.4, str(i), 2.8, cls=\"\") for i in (0, 1, 2, n))\n    return s + text(x, y - 2.2, f\"Skala {skala} (A3)\", 2.8, \"start\", cls=\"\") + text(x, y + 8.4, \"Meter\", 2.8, \"start\", cls=\"\")\n\n\ndef lista(x, y, rubr, rader, size=2.8, steg=4.2):  # F\u00d6RKLARINGAR-spalt; rader = (nr eller \"\", text eller [rader]). Ger (svg, n\u00e4sta y)\n    s, y = rubrik(x, y, rubr, 3.5, \"start\"), y + 7.5\n    for nr, rad in rader:\n        rad = [rad] if isinstance(rad, str) else rad\n        if nr:\n            s += bubbla(lambda u, h: (u, h), nr, (x + 2.2, y - 1))\n        s += \"\".join(text(x + (7 if nr else 0), y + i * steg, r, size, \"start\") for i, r in enumerate(rad))\n        y += len(rad) * steg + 1.8\n    return s, y\n\n\ndef ram(w, h):  # ritningsram med p\u00e4rmmarginal till v\u00e4nster och mittmarkeringar\n    return (f'<rect class=\"ram\" x=\"20\" y=\"10\" width=\"{w - 30}\" height=\"{h - 20}\"/>' +\n            line((w / 2, 4), (w / 2, 10), \"l\") + line((w / 2, h - 10), (w / 2, h - 4), \"l\") +\n            line((14, h / 2), (20, h / 2), \"l\") + line((w - 10, h / 2), (w - 4, h / 2), \"l\"))\n\n\nDEFS = \"\"\"<defs><style>\n.ny{fill:#b4b4b4;stroke:#000;stroke-width:.35}.bef{fill:#fff;stroke:#000;stroke-width:.35}.vk{fill:none;stroke:#000;stroke-width:.7}.nyf{fill:#b4b4b4}.beff{fill:#fff}.g{stroke:#555;stroke-width:.08}.snof{fill:#fff}.sno{fill:none;stroke:#000;stroke-width:.45}\n.l{fill:none;stroke:#000;stroke-width:.35}.t{fill:none;stroke:#000;stroke-width:.18}\n.d{fill:none;stroke:#000;stroke-width:.25;stroke-dasharray:2 1}\n.sn{fill:none;stroke:#000;stroke-width:.35;stroke-dasharray:6 1.5 1 1.5}\n.vagg{fill:url(#panel);stroke:#000;stroke-width:.35}.tak{fill:url(#plat);stroke:#000;stroke-width:.35}\n.port{fill:#fff;stroke:#000;stroke-width:.35}.mark{stroke:#000;stroke-width:.7}\n.taksnitt{fill:none;stroke:#000;stroke-width:.6;stroke-linejoin:round}.pil{fill:#000}\n.ram{fill:none;stroke:#000;stroke-width:.7}.bub{fill:#fff;stroke:#000;stroke-width:.25}.u{text-decoration:underline}\n.takyta{fill:none;stroke:#000;stroke-width:.35}.pannE{fill:url(#pannE)}.pannN{fill:url(#pannN)}.takbg{fill:#f2f2f2}.ribba{stroke:#444;stroke-width:.3}.rilla{stroke:#aaa;stroke-width:.07}.ranna{fill:#fff;stroke:#000;stroke-width:.25}.rum{font-weight:600;font-family:Bahnschrift,Arial,sans-serif}.stup{fill:#fff;stroke:#000;stroke-width:.3}\n.ror1{fill:none;stroke:#000;stroke-width:1.1;stroke-linejoin:round}.ror2{fill:none;stroke:#fff;stroke-width:.6;stroke-linejoin:round}\ntext{font-family:Bahnschrift,'Arial Narrow',Arial,sans-serif;font-stretch:condensed;font-weight:300;text-transform:uppercase;fill:#000}.h{paint-order:stroke;stroke:#fff;stroke-width:.8}\n<\/style>\n<pattern id=\"panel\" patternUnits=\"userSpaceOnUse\" width=\"2.5\" height=\"10\"><rect width=\"2.5\" height=\"10\" fill=\"#fff\"/><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"10\" stroke=\"#999\" stroke-width=\".12\"/><\/pattern>\n<pattern id=\"plat\" patternUnits=\"userSpaceOnUse\" width=\"2.75\" height=\"10\"><rect width=\"2.75\" height=\"10\" fill=\"#f2f2f2\"/><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"10\" stroke=\"#555\" stroke-width=\".2\"/><\/pattern>\n<pattern id=\"pannE\" patternUnits=\"userSpaceOnUse\" width=\"10\" height=\"2.75\"><rect width=\"10\" height=\"2.75\" fill=\"#f2f2f2\"/><line x1=\"0\" y1=\"0\" x2=\"10\" y2=\"0\" stroke=\"#555\" stroke-width=\".2\"/><\/pattern>\n<pattern id=\"pannN\" patternUnits=\"userSpaceOnUse\" width=\"2.75\" height=\"10\"><rect width=\"2.75\" height=\"10\" fill=\"#f2f2f2\"/><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"10\" stroke=\"#555\" stroke-width=\".2\"/><\/pattern>\n<\/defs>\"\"\"\n\n\ndef sida(body, w=420, h=297):  # klass land/stand styr sidans orientering i PDF:en (\"port\" \u00e4r upptagen av \u00f6ppningarnas stil)\n    return (f'<svg class=\"{\"land\" if w > h else \"stand\"}\" xmlns=\"http://www.w3.org/2000/svg\" width=\"{w}mm\" height=\"{h}mm\" '\n            f'viewBox=\"0 0 {w} {h}\">{DEFS}{ram(w, h)}{body}<\/svg>')\n\n\n# ---------- r\u00e4nnor, stupr\u00f6r och sn\u00f6rasskydd (anv\u00e4nds p\u00e5 alla blad) ----------\ndef ranna_snitt(p, u, tf, ut):  # halvrund r\u00e4nna i genomsk\u00e4rning med vulst ytterst; u = r\u00e4nnans mitt, ut = +1/-1 ut\u00e5t\n    (x, y), (x1, _) = p(u, tf - 0.03), p(u + 0.07, 0)\n    r = abs(x1 - x)\n    return (f'<path class=\"ranna\" d=\"M{x - ut * r:.2f},{y - 0.3:.2f} L{x - ut * r:.2f},{y:.2f} '\n            f'A{r:.2f},{r:.2f} 0 0 {0 if ut > 0 else 1} {x + ut * r:.2f},{y:.2f}\"/>'\n            f'<circle class=\"ranna\" cx=\"{x + ut * (r + 0.2):.2f}\" cy=\"{y:.2f}\" r=\".2\"/>')\n\n\ndef ranna_band(p, u0, u1, tf):  # h\u00e4ngr\u00e4nna sedd fr\u00e5n sidan: r\u00e4nnan + vulsten i \u00f6verkant\n    return box(p, u0, tf - 0.15, u1, tf - 0.03, \"port\") + line(p(u0, tf - 0.055), p(u1, tf - 0.055))\n\n\ndef rundad(pts, r):  # SVG-path l\u00e4ngs punkterna med rundade h\u00f6rn (radie r i mm p\u00e5 papperet)\n    d = f\"M{pts[0][0]:.2f},{pts[0][1]:.2f}\"\n    for a, b, c in zip(pts, pts[1:], pts[2:]):\n        la, lc = math.dist(a, b), math.dist(b, c)\n        k = min(r, la / 2, lc / 2)\n        p1 = (b[0] + (a[0] - b[0]) * k / la, b[1] + (a[1] - b[1]) * k / la)\n        p2 = (b[0] + (c[0] - b[0]) * k / lc, b[1] + (c[1] - b[1]) * k / lc)\n        d += f\" L{p1[0]:.2f},{p1[1]:.2f} Q{b[0]:.2f},{b[1]:.2f} {p2[0]:.2f},{p2[1]:.2f}\"\n    return d + f\" L{pts[-1][0]:.2f},{pts[-1][1]:.2f}\"\n\n\ndef stupror(p, vagg, u, top):  # sett framifr\u00e5n: stos under r\u00e4nnan, r\u00f6r, tv\u00e5 klammor, utkastare\n    s = \"\"\n    for v, a in STUPROR:\n        if v == vagg:\n            m, zt = u(a), top - 0.15\n            s += (poly([p(m - 0.08, zt), p(m + 0.08, zt), p(m + 0.045, zt - 0.1), p(m - 0.045, zt - 0.1)], \"port\")\n                  + box(p, m - 0.045, 0.2, m + 0.045, zt - 0.1, \"port\")\n                  + \"\".join(box(p, m - 0.06, h - 0.025, m + 0.06, h + 0.025, \"port\") for h in (0.6, 1.1))\n                  + box(p, m - 0.05, 0.1, m + 0.05, 0.2, \"port\"))\n    return s\n\n\ndef stupror_profil(p, uv, ut, tf, tfu):  # stupr\u00f6r fr\u00e5n sidan: stos -> mjuka b\u00f6jar in mot v\u00e4ggen -> r\u00f6r -> utkastare\n    ug, uw, zt = uv + ut * (tfu + RANNA / 2), uv + ut * 0.07, tf - 0.15\n    pts = [p(ug, zt), p(ug, zt - 0.12), p(uw, zt - 0.12 - abs(ug - uw) * 1.4), p(uw, 0.35), p(uw + ut * 0.25, 0.1)]\n    d = rundad(pts, 1.5)\n    klammor = \"\".join(line(p(uv, h), p(uw + ut * 0.05, h), \"l\") for h in (0.6, 1.1))\n    return (klammor + f'<path class=\"ror1\" d=\"{d}\"/><path class=\"ror2\" d=\"{d}\"/>'\n            + poly([p(ug - 0.08, zt + 0.02), p(ug + 0.08, zt + 0.02), p(ug + 0.045, zt - 0.08), p(ug - 0.045, zt - 0.08)], \"port\"))\n\n\ndef sno_band(p, u0, u1, z):  # sn\u00f6rasskydd framifr\u00e5n: galler mellan tv\u00e5 ledare, f\u00e4sten c/c SNO_CC\n    u0, u1 = min(u0, u1), max(u0, u1)\n    n = max(1, round((u1 - u0) / 0.1))\n    s = box(p, u0, z, u1, z + SNO_H, \"snof\")\n    s += \"\".join(line(p(u0 + (u1 - u0) * i / n, z), p(u0 + (u1 - u0) * i / n, z + SNO_H), \"g\") for i in range(n + 1))\n    s += line(p(u0, z), p(u1, z)) + line(p(u0, z + SNO_H), p(u1, z + SNO_H))\n    k = max(1, round((u1 - u0) / SNO_CC))\n    return s + \"\".join(line(p(u0 + (u1 - u0) * (i + 0.5) / k, z - 0.04), p(u0 + (u1 - u0) * (i + 0.5) / k, z + SNO_H), \"l\")\n                       for i in range(k))\n\n\ndef sno_profil(p, u, z):  # sn\u00f6rasskydd fr\u00e5n sidan: ett lodr\u00e4tt galler som st\u00e5r p\u00e5 takytan\n    return line(p(u, z - 0.04), p(u, z + SNO_H), \"sno\")\n\n\ndef sno_plan(p):  # sn\u00f6rasskydd i takplanen: linje + f\u00e4sten c/c SNO_CC som pekar mot takfoten\n    s = \"\"\n    for ax, c, a0, a1, z in SNORAS:\n        q = (lambda t, d: p(c + d, t)) if ax == \"y\" else (lambda t, d: p(t, c + d))\n        ut = 0.2 if c > (MX if ax == \"y\" else PORT_MITT) else -0.2\n        k = max(1, round((a1 - a0) / SNO_CC))\n        s += line(q(a0, 0), q(a1, 0), \"sno\") + \"\".join(line(q(a0 + (a1 - a0) * (i + 0.5) / k, 0), q(a0 + (a1 - a0) * (i + 0.5) / k, ut))\n                                                     for i in range(k))\n    return s\n\n\n# ---------- Sida 1: planritning + sektion (stil efter LINK arkitekturs planer: gr\u00e5 stomme, kedjem\u00e5tt i mm) ----------\nP = vy(62, 240)\ns = [rubrik(45, 30, \"PLANRITNING 1:100\", 4, \"start\")]\ns.append(box(P, 0, 0, E_X, E_L, \"d\"))\ns.append(text(*P(1.3, E_L * 0.62), \"BEF. ALTAN\", 2.8))\nV_OST, V_VAST = (\"x\", E_HX, 1), (\"x\", E_X, -1)\nV_NORR, V_NV, V_NO = (\"y\", Y_N + N_B, 1), (\"x\", 0, -1), (\"x\", N_L, 1)\np0, p1 = PORT_MITT - PORT_B / 2, PORT_MITT + PORT_B / 2\ns.append(vaggar(P, [(E_X, 0, E_HX, T, \"bef\"), (E_X + T, E_L - T, E_HX - T, E_L, \"bef\")]\n                + bitar(\"y\", E_X, E_X + T, T, E_L + T, ALTAN_DORR + ALTAN_FONSTER, \"bef\")\n                + bitar(\"y\", E_HX - T, E_HX, T, E_L + T, GRUS_DORR + GRUS_FONSTER, \"bef\")\n                + bitar(\"x\", Y_N + N_B - T, Y_N + N_B, 0, N_L, N_FONSTER_NORR, \"ny\")\n                + bitar(\"y\", 0, T, Y_N, Y_N + N_B - T, N_FONSTER_VAST, \"ny\")\n                + bitar(\"y\", N_L - T, N_L, Y_N, Y_N + N_B - T, [(p0, p1)], \"ny\")\n                + [(T, Y_N, E_X, Y_N + T, \"ny\"), (E_HX, Y_N, N_L - T, Y_N + T, \"ny\")]))\n# \u00f6ppningar med beteckning: (kod, v\u00e4gg, u0, u1, typ, text i f\u00f6rteckningen)\noppn, nr = [], {\"F\": 0, \"D\": 0, \"P\": 0}\nfor v, lst, typ, ny in ((V_OST, GRUS_FONSTER, \"F\", False), (V_VAST, ALTAN_FONSTER, \"F\", False),\n                        (V_NORR, N_FONSTER_NORR, \"F\", True), (V_NV, N_FONSTER_VAST, \"F\", True),\n                        (V_OST, GRUS_DORR, \"D\", False), (V_VAST, ALTAN_DORR, \"D\", False), (V_NO, [(p0, p1)], \"P\", True)):\n    for u0, u1 in lst:\n        nr[typ] += 1\n        h = {\"F\": FONSTER_H[1] - FONSTER_H[0], \"D\": DORR_H, \"P\": PORT_H}[typ]\n        namn = {\"F\": \"F\u00f6nster\", \"D\": \"Pard\u00f6rr\" if u1 - u0 > 1.5 else \"D\u00f6rr\", \"P\": \"Garageport, takskjutande\"}[typ]\n        oppn.append((f\"{typ}{nr[typ]}\", v, u0, u1, typ,\n                     f\"{namn} {f(u1 - u0)} x {f(h)} m, {'ny (f\u00f6rslag)' if ny and typ == 'F' else 'ny' if ny else 'befintlig'}\"))\nfor kod, v, u0, u1, typ, _ in oppn:\n    q = vq(P, v)\n    if typ == \"F\":\n        s.append(plan_fonster(P, v, u0, u1))\n    elif typ == \"D\":  # pard\u00f6rr: g\u00e5ngj\u00e4rn i b\u00e5da karmarna; enkeld\u00f6rr: g\u00e5ngj\u00e4rn mot tillbyggnaden\n        s.append(plan_dorr(P, v, u0, u1, [(u0, 1), (u1, -1)] if u1 - u0 > 1.5 else [(u1, -1)]))\n    else:  # port: st\u00e4ngd i v\u00e4ggen, streckad i \u00f6ppet l\u00e4ge under taket\n        s += [line(q(u0, T), q(u1, T), \"l\"), poly([q(u0, T), q(u1, T), q(u1, T + PORT_H + 0.4), q(u0, T + PORT_H + 0.4)], \"d\"),\n              text(*q((u0 + u1) / 2, T + PORT_H / 2 + 0.6), \"PORT I \u00d6PPET L\u00c4GE\", 2, rot=-90 if v[0] == \"x\" else 0)]\n    x, y = q((u0 + u1) / 2, -0.45 if typ != \"D\" else -0.3 - (u1 - u0) / (2 if u1 - u0 > 1.5 else 1) - 0.25)\n    s.append(text(x + (1 if v[0] == \"x\" else 0), y + (0 if v[0] == \"x\" else 1), kod, 2.4, rot=-90 if v[0] == \"x\" else 0))\n# rumsnamn: liten f\u00f6rklaring ovanf\u00f6r, fet rumsben\u00e4mning, BYA under\nfor (xm, ym), liten, namn, bya in (((E_X + E_B / 2, E_L / 2), \"BEFINTLIG\", \"GARAGE/F\u00d6RR\u00c5D\", E_B * E_L),\n                                   ((N_L / 2, Y_N + N_B / 2), \"TILLBYGGNAD\", \"GARAGE\", N_L * N_B)):\n    cx, cy = P(xm, ym)\n    s += [text(cx, cy - 4, liten, 2.4), text(cx, cy, namn, 3.6, cls=\"h rum\"), text(cx, cy + 4.5, f\"BYA {f(bya, 0)} m\u00b2\", 2.6)]\n# m\u00e5ttkedjor i mm: n\u00e4rmast \u00f6ppningarna, sedan byggnadsdelar, ytterst totalm\u00e5tt\nost = sorted({0, E_L, *sum(GRUS_DORR + GRUS_FONSTER, ()), p0, p1, Y_N + N_B})\ns += [kedja(P, sorted({0, *sum(N_FONSTER_NORR, ()), N_L}), Y_N + N_B + 1.0), kedja(P, [0, E_X, E \", \"Fasad: falur\u00f6d. Foder och smygar: falur\u00f6d som fasaden.\"),\n    (\"\", [\"F\u00f6nster, d\u00f6rrar och garageport: ockragul,\", \"f\u00f6nster i tillbyggnaden som befintliga f\u00f6nster.\"]),\n    (\"\", [\"Tak, h\u00e4ngr\u00e4nnor, stupr\u00f6r och sn\u00f6rasskydd:\", \"RAL 9006 silver metallic.\"])])\ns += [forkl, kulor, skalstock(27, 275), huvud(\"Fasader\", \"A-02\")]\nsida2 = sida(\"\".join(s))\n\n# ---------- Sida 3: takplan, 1:100 p\u00e5 A3 liggande ----------\nTP = vy(70, 245)\nyn, ex, mx = Y_N + N_B, E_X + E_B / 2, Y_N - TF_N   # tillbyggnadens bortre v\u00e4gg, befintligs nock, takfot mot befintlig\nkant = [(-GAV, mx), (E_X - TF, mx), (E_X - TF, -GAV), (E_HX + TF, -GAV), (E_HX + TF, mx),\n        (N_L + GAV, mx), (N_L + GAV, yn + TF_N), (-GAV, yn + TF_N)]\ns = [rubrik(45, 30, \"TAKPLAN 1:100\", 4, \"start\"),\n     # takpl\u00e5t: ribborna g\u00e5r nedf\u00f6r taket, olika riktning p\u00e5 befintligt och nytt tak. Rillorna blir f\u00f6r t\u00e4ta i 1:100.\n     ribbor(TP, ((E_X - TF, -GAV), (E_HX + TF, -GAV), (E_HX + TF, mx), (ex, PORT_MITT), (E_X - TF, mx)), True, False),\n     ribbor(TP, ((-GAV, mx), (E_X - TF, mx), (ex, PORT_MITT), (E_HX + TF, mx), (N_L + GAV, mx),\n                 (N_L + GAV, yn + TF_N), (-GAV, yn + TF_N)), False, False),\n     poly([TP(*q) for q in kant], \"takyta\"),\n     box(TP, 0, Y_N, N_L, yn, \"d\"), box(TP, E_X, 0, E_HX, Y_N, \"d\"),\n     line(TP(ex, -GAV), TP(ex, PORT_MITT), \"l\"), line(TP(-GAV, PORT_MITT), TP(N_L + GAV, PORT_MITT), \"l\"),\n     line(TP(ex, PORT_MITT), TP(E_X - TF, mx), \"l\"), line(TP(ex, PORT_MITT), TP(E_HX + TF, mx), \"l\"),\n     # h\u00e4ngr\u00e4nnor l\u00e4ngs takf\u00f6tterna\n     box(TP, E_X - TF - RANNA, -GAV, E_X - TF, mx, \"port\"), box(TP, E_HX + TF, -GAV, E_HX + TF + RANNA, mx, \"port\"),\n     box(TP, -GAV, mx - RANNA, E_X - TF, mx, \"port\"), box(TP, E_HX + TF, mx - RANNA, N_L + GAV, mx, \"port\"),\n     box(TP, -GAV, yn + TF_N, N_L + GAV, yn + TF_N + RANNA, \"port\"),\n     # takfall\n     sno_plan(TP), fall(TP, E_X + 2.0, E_L / 2, 180, LUTNING), fall(TP, E_HX - 2.0, E_L / 2, 0, LUTNING),\n     fall(TP, N_L / 2, yn - 2.2, -90, N_LUTNING), fall(TP, 2, Y_N + 2.2, 90, N_LUTNING),\n     fall(TP, N_L - 1.2, Y_N + 2.2, 90, N_LUTNING),\n     text(*TP(N_L / 2 + 2.0, PORT_MITT + 0.2), f\"NOCK +{f(N_NOCK, 2)}\", 3),\n     bubbla(TP, 4, (E_X - TF - 1.0, 3.5), (E_X - TF + SNO_IN, 3.5)),\n     bubbla(TP, 1, (E_X + 1.2, 3.0)), bubbla(TP, 1, (4.0, Y_N + 2.4)),\n     bubbla(TP, 2, (11.4, 5.5), (E_HX + TF + RANNA, 5.5)), bubbla(TP, 3, (11.4, 1.6), (E_HX + TF + RANNA / 2, 0.2)),\n     dim(TP, -GAV, N_L + GAV, yn + TF_N + 0.6), dim(TP, E_X - TF, E_HX + TF, -GAV - 0.6),\n     dim(TP, -GAV, yn + TF_N, N_L + GAV + 0.6, True), dim(TP, mx, yn + TF_N, -GAV - 0.6, True)]\nror = {\"E_ost\": lambda a: (E_HX + TF + RANNA / 2, a), \"E_vast\": lambda a: (E_X - TF - RANNA / 2, a),\n       \"N_norr\": lambda a: (a, yn + TF_N + RANNA / 2)}\ns += ['<circle class=\"stup\" cx=\"%.2f\" cy=\"%.2f\" r=\".45\"/>' % TP(*ror[v](a)) for v, a in STUPROR]\n# teckenf\u00f6rklaring till h\u00f6ger, ovanf\u00f6r ritningshuvudet\nlx, ly = 235, 60\nforkl, ly = lista(lx, ly, \"F\u00d6RKLARINGAR\", [\n    (1, \"Takpl\u00e5t Lindab LPPN20D Ranarp, RAL 9006 silver metallic\"),\n    (2, \"H\u00e4ngr\u00e4nna, halvrund 125 mm\"), (3, \"Stupr\u00f6r \u00d8 90 mm\"),\n    (4, f\"Sn\u00f6rasskydd, gallermodell, {f(SNO_IN)} m in fr\u00e5n takfoten, f\u00e4sten c/c {f(SNO_CC)} m\")])\npilspets = [(lx + 5, ly + 6.5), (lx + 7, ly + 8), (lx + 5, ly + 9.5)]\ns += [forkl,\n      f'<rect x=\"{lx}\" y=\"{ly - 2}\" width=\"7\" height=\"3\" class=\"d\"/>', text(lx + 10, ly + 0.6, \"Ytterv\u00e4gg under taket\", 2.8, \"start\"),\n      line((lx, ly + 8), (lx + 7, ly + 8), \"l\"), pline(pilspets, \"l\"), text(lx + 10, ly + 9, \"Takfall med lutning\", 2.8, \"start\"),\n      line((lx, ly + 15), (lx + 7, ly + 15), \"l\"), text(lx + 10, ly + 16, \"Nock och r\u00e4nndal (d\u00e4r tv\u00e5 tak m\u00f6ts)\", 2.8, \"start\")]\nanm, _ = lista(lx, ly + 30, \"ANM\u00c4RKNINGAR\", [\n    (\"\", [f\"Takutspr\u00e5ng: befintlig takfot {f(TF)} m (uppskattat fr\u00e5n video), gavel {f(GAV)} m.\",\n          f\"Tillbyggnadens takfot {f(TF_N)} m, s\u00e5 att b\u00e5da takf\u00f6tterna ligger p\u00e5 +{f(E_TF, 2)}\",\n          \"och h\u00e4ngr\u00e4nnorna g\u00e5r i samma linje.\"]),\n    (\"\", [\"Tillbyggnadens korta takf\u00f6tter mot befintlig byggnad leds\",\n          \"till befintliga r\u00e4nnor och stupr\u00f6r i innerh\u00f6rnen.\"]),\n    (\"\", \"H\u00e4ngr\u00e4nnor och stupr\u00f6r: RAL 9006 silver metallic.\")])\ns += [anm, skalstock(27, 275), huvud(\"Takplan\", \"A-03\")]\nsida3 = sida(\"\".join(s))\n# ---------- HTML -> PDF via Edge (k\u00f6rs inte i den interaktiva sidan, d\u00e4r finns bara SVG-delen ovan) ----------\nif __name__ == \"__main__\":\n    import subprocess\n\n    import interaktiv\n\n    here = pathlib.Path(__file__).resolve().parent\n    html = here / \"ritning.html\"\n    pdf = here / \"Bygglovsritning_garage_Amsele.pdf\"\n    html.write_text(\"<!doctype html><meta charset='utf-8'><style>@page land{size:420mm 297mm;margin:0}@page port{size:297mm 420mm;margin:0}.land{page:land}.stand{page:port}\"\n                    \"body{margin:0}svg{display:block;break-after:page}svg:last-child{break-after:auto}<\/style>\"\n                    + sida1 + sida2 + sida3, encoding=\"utf-8\")\n    edge = next(p for p in (r\"C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe\",\n                            r\"C:\\Program Files\\Microsoft\\Edge\\Application\\msedge.exe\") if pathlib.Path(p).exists())\n    subprocess.run([edge, \"--headless\", \"--disable-gpu\", \"--no-pdf-header-footer\", f\"--print-to-pdf={pdf}\", html.as_uri()], check=True)\n    # PNG-bilder att titta p\u00e5 i mobilen\n    for nr, svg in ((\"A-01\", sida1), (\"A-02\", sida2), (\"A-03\", sida3)):\n        html.write_text(\"<!doctype html><meta charset='utf-8'><style>body{margin:0}svg{display:block;width:100vw;height:auto}<\/style>\"\n                        + svg, encoding=\"utf-8\")\n        png = here / f\"Ritning_{nr}.png\"\n        storlek = \"1240,877\" if 'class=\"land\"' in svg else \"877,1240\"\n        subprocess.run([edge, \"--headless\", \"--disable-gpu\", \"--hide-scrollbars\", f\"--window-size={storlek}\", \"--force-device-scale-factor=2\",\n                        f\"--screenshot={png}\", html.as_uri()], check=True)\n    print(f\"Klar: {pdf.name} + PNG  (nock +{f(N_NOCK, 2)}, taklutning tillbyggnad {f(N_LUTNING)}\u00b0)\")\n    interaktiv.bygg(here)\n", WEB = "\nimport json, re, sys, types\nINP, HARL = MATT_SRC.split(\"# ---- h\u00e4rlett\", 1)\nHARL = \"# ---- h\u00e4rlett\" + HARL\nRAD = re.compile(r\"^([A-Z][A-Z0-9_]*(?:\\s*,\\s*[A-Z][A-Z0-9_]*)*)\\s*=\\s*(.*?)\\s*(#.*)?$\")\n\n\ndef _namn(m):\n    return [n.strip() for n in m.group(1).split(\",\")]\n\n\ndef _indata():\n    g = {}\n    exec(INP, g)\n    return g\n\n\ndef falt_json():  # raderna med indata: namn, v\u00e4rden och kommentaren fr\u00e5n matt.py\n    g = _indata()\n    return json.dumps([{\"namn\": _namn(m), \"varden\": [g[n] for n in _namn(m)], \"text\": (m.group(3) or \"\").lstrip(\"# \")}\n                       for m in map(RAD.match, INP.splitlines()) if m])\n\n\ndef _konv(v, orig):  # JSON-listor tillbaka till samma form som i matt.py (tupler, listor av tupler, heltal)\n    if isinstance(orig, tuple):\n        return tuple(_konv(a, b) for a, b in zip(v, orig))\n    if isinstance(orig, list):\n        return [_konv(a, orig[0]) if orig else tuple(map(float, a)) for a in v]\n    if isinstance(orig, int) and float(v).is_integer():\n        return int(v)\n    return float(v)\n\n\ndef rita(over_json):\n    over, g = json.loads(over_json), _indata()\n    g.update({k: _konv(v, g[k]) for k, v in over.items()})\n    exec(HARL, g)\n    mod = types.ModuleType(\"matt\")\n    mod.__dict__.update(g)\n    sys.modules[\"matt\"] = mod\n    r = {\"__name__\": \"webb\"}\n    exec(RITNING_SRC, r)\n    info = (f\"Nock +{g['N_NOCK']:.2f} \u00b7 tillbyggnadens lutning {g['N_LUTNING']:.1f}\u00b0 \u00b7 \"\n            f\"takfot +{g['E_TF']:.2f} \u00b7 tillbyggnadens takutspr\u00e5ng {g['TF_N']:.2f} m\")\n    return json.dumps({\"sidor\": [r[\"sida1\"], r[\"sida2\"], r[\"sida3\"]], \"info\": info.replace(\".\", \",\")})\n\n\ndef ny_matt(over_json):  # matt.py med de nya v\u00e4rdena, kommentarer och resten of\u00f6r\u00e4ndrat\n    over, g, rader = json.loads(over_json), _indata(), []\n    for rad in INP.splitlines():\n        m = RAD.match(rad)\n        if m and any(n in over for n in _namn(m)):\n            ns = _namn(m)\n            vanster = f\"{', '.join(ns)} = {', '.join(repr(_konv(over[n], g[n]) if n in over else g[n]) for n in ns)}\"\n            rad = f\"{vanster:<26} {m.group(3)}\" if m.group(3) else vanster\n        rader.append(rad)\n    return \"\\n\".join(rader) + \"\\n\" + HARL\n";
const NAMN = {VAGG: "Vägghöjd", LUTNING: "Taklutning befintlig (grader)", E_B: "Befintlig: bredd", E_L: "Befintlig: längd",
  N_L: "Tillbyggnad: längd", N_B: "Tillbyggnad: bredd", E_X: "Tillbyggnaden sticker ut åt vänster", PORT_B: "Port: bredd",
  PORT_H: "Port: höjd", GRUS_DORR: "Dörrar fasad 1 (befintliga)", GRUS_FONSTER: "Fönster fasad 1 (befintliga)",
  ALTAN_DORR: "Dörrar fasad 3 (befintliga)", ALTAN_FONSTER: "Fönster fasad 3 (befintliga)", DORR_H: "Dörrhöjd",
  FONSTER_H: "Fönster: underkant, överkant", N_FONSTER_NORR: "Fönster fasad 2 (tillbyggnad)",
  N_FONSTER_VAST: "Fönster i gaveln, fasad 3", TF: "Takutsprång takfot (befintlig)", GAV: "Takutsprång gavel",
  SNO_IN: "Snörasskydd: avstånd från takfot", SNO_H: "Snörasskydd: höjd", SNO_CC: "Snörasskydd: fästen c/c",
  RANNA: "Hängränna: storlek i ritningen", T: "Väggtjocklek"};
let py, rader, varden = {}, over = {}, timer;
const $ = id => document.getElementById(id);

function input(v, satt) {
  const e = document.createElement("input");
  e.type = "number"; e.step = "0.05"; e.value = v;
  e.oninput = () => { if (e.value !== "") { satt(parseFloat(e.value)); andrat(); } };
  return e;
}
function knapp(txt, fn) { const b = document.createElement("button"); b.textContent = txt; b.onclick = fn; return b; }

function bygg() {  // formuläret byggs från raderna i matt.py
  const f = $("falt"); f.innerHTML = "";
  for (const r of rader) for (const n of r.namn) {
    const d = document.createElement("div"); d.className = "rad";
    d.innerHTML = `<div class="namn">${NAMN[n] || n}</div><div class="hjalp">${n} · ${r.text}</div>`;
    const v = varden[n];
    if (typeof v === "number") d.append(input(v, x => varden[n] = x));
    else if (typeof v[0] === "number") v.forEach((x, i) => d.append(input(x, y => v[i] = y), " "));
    else {  // lista med öppningar: från, till
      v.forEach((p, i) => {
        const rad = document.createElement("div"); rad.className = "par";
        rad.append("från ", input(p[0], y => p[0] = y), " till ", input(p[1], y => p[1] = y), " ",
                   knapp("ta bort", () => { v.splice(i, 1); bygg(); andrat(); }));
        d.append(rad);
      });
      d.append(knapp("+ lägg till", () => { const s = v[v.length - 1]; v.push(s ? [s[1] + 1, s[1] + 2.1] : [1, 2.1]); bygg(); andrat(); }));
    }
    f.append(d);
  }
}
function andrat() {  // jämför med originalet och rita om lite senare (inte vid varje tangenttryck)
  over = {};
  for (const r of rader) r.namn.forEach((n, i) => { if (JSON.stringify(varden[n]) !== JSON.stringify(r.varden[i])) over[n] = varden[n]; });
  clearTimeout(timer); timer = setTimeout(rita, 250);
}
function rita() {
  try {
    const r = JSON.parse(py.globals.get("rita")(JSON.stringify(over)));
    $("blad").innerHTML = r.sidor.join(""); $("info").textContent = r.info; $("fel").textContent = "";
  } catch (e) {
    const sista = String(e.message).trim().split("\n").pop();
    $("fel").textContent = "Kunde inte rita med de här måtten: " +
      (sista.startsWith("AssertionError") ? "måtten går inte ihop (t.ex. porten är bredare eller högre än väggen)." : sista);
  }
}
function nollst() { varden = {}; rader.forEach(r => r.namn.forEach((n, i) => varden[n] = structuredClone(r.varden[i]))); bygg(); andrat(); }

$("pdf").onclick = () => window.print();
$("nollst").onclick = nollst;
$("spara").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([py.globals.get("ny_matt")(JSON.stringify(over))], {type: "text/x-python"}));
  a.download = "matt.py"; a.click();
};
(async () => {
  py = await loadPyodide();
  py.globals.set("MATT_SRC", MATT); py.globals.set("RITNING_SRC", RITNING);
  py.runPython(WEB);
  rader = JSON.parse(py.globals.get("falt_json")());
  nollst();
})().catch(e => $("fel").textContent = "Kunde inte starta: " + e.message + " (sidan behöver internet första gången)");
